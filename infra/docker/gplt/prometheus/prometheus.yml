global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: gplt
    environment: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  # Example targets for applications running on your host machine.
  # Spring Boot (Micrometer + Actuator): http://localhost:8080/actuator/prometheus
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # .NET (OpenTelemetry Prometheus exporter endpoint): http://localhost:9464/metrics
  - job_name: dotnet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
