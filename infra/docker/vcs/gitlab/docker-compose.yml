services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:latest}
    container_name: gitlab
    restart: always
    hostname: ${GITLAB_HOSTNAME:-localhost}
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      - "${GITLAB_HTTPS_PORT:-8443}:${GITLAB_HTTPS_PORT:-8443}"
      - "${GITLAB_SSH_PORT:-2424}:22"
    volumes:
      - ${GITLAB_HOME}/config:/etc/gitlab
      - ${GITLAB_HOME}/logs:/var/log/gitlab
      - ${GITLAB_HOME}/data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME:-localhost}:${GITLAB_HTTP_PORT:-8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2424}
        # Optimization for small personal instance
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        # Timezone
        gitlab_rails['time_zone'] = 'UTC'
        # Optional: Set the initial root password here
        # gitlab_rails['initial_root_password'] = "your_password" 
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - gitlab-net

  gitlab-runner:
    image: ${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:latest}
    container_name: gitlab-runner
    restart: always
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - ${GITLAB_HOME}/runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "gitlab-runner status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - gitlab-net

networks:
  gitlab-net:
    name: gitlab-net
    driver: bridge